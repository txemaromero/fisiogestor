  # Mensajes de la recuperación de la clave y de la confirmación del email (D103): los de devise-i18n dicen
  # «contraseña» y mezclan «usted» y «tú»; la aplicación usa «clave» y «tú».
  devise:
    registrations:
      signed_up_but_unconfirmed: "Te hemos enviado un correo con un enlace para confirmar tu email. Ábrelo para activar tu cuenta: hasta entonces no puedes entrar."
    confirmations:
      confirmed: Tu email está confirmado. Ya puedes iniciar sesión.
      send_paranoid_instructions: "Si ese email tiene una cuenta sin confirmar, recibirás en unos minutos un correo con un enlace para confirmarlo."
    failure:
      unconfirmed: "Antes de entrar tienes que confirmar tu email con el enlace del correo que te enviamos al registrarte."
      # Con la clave incorrecta, el mismo mensaje exista o no la cuenta (modo paranoico).
      invalid: "%{authentication_keys} o clave incorrectos."
      not_found_in_database: "%{authentication_keys} o clave incorrectos."
    passwords:
      send_paranoid_instructions: "Si ese email tiene una cuenta, recibirás en unos minutos un correo con un enlace para elegir una clave nueva."
      updated: Tu clave se ha cambiado y has iniciado sesión.
      updated_not_active: Tu clave se ha cambiado. Ya puedes iniciar sesión.
      no_token: "Solo se puede llegar a esta página con el enlace del correo para cambiar la clave. Comprueba que has copiado el enlace completo."
    mailer:
      reset_password_instructions:
        subject: Cambiar la clave de RedSocialFisios
      confirmation_instructions:
        subject: Confirma tu email en RedSocialFisios

  errors:
    messages:
      expired: "ha caducado: pide uno nuevo"
      already_confirmed: "ya está confirmado: inicia sesión"
      confirmation_period_expired: "no se confirmó a tiempo (el enlace caduca a los %{period}): pide otro correo"
