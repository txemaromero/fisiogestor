# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# Producción: PostgreSQL (la gema pg está en el grupo :production del Gemfile). Define DATABASE_URL, p. ej.
#   postgres://usuario:clave@servidor:5432/red_social_fisios_production
production:
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  url: <%= ENV["DATABASE_URL"] %>
  # Conexión cifrada con la base de datos: «require» cifra; «verify-full» (con PGSSLROOTCERT) comprueba
  # además el certificado del servidor y es lo recomendable. Sin cifrar (disable, allow o prefer) la
  # aplicación no arranca, salvo con PERMITIR_BD_SIN_SSL=1 para pruebas locales (D98). Un ?sslmode=... en
  # DATABASE_URL manda sobre este, y también se comprueba (D104).
  sslmode: <%= ENV.fetch("PGSSLMODE", "require") %>
